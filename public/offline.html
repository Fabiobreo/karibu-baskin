<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karibu Baskin · Senza connessione</title>
  <!--
    Pagina che il service worker mostra quando una pagina non e' in cache e la
    rete manca. Stesse frasi dell'app (common.networkError, offline.banner) e
    colori di @/lib/palette: qui non si puo' importare, quindi palette.test.ts
    controlla che ogni colore sia uno di quelli. La lingua viene solo dal
    cookie, come nel resto del sito: senza cookie e' italiano.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1A1A1A;
      color: #FFFFFF;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px 16px;
      text-align: center;
    }
    img { width: 72px; height: 72px; object-fit: contain; }
    h1 { font-size: 1.5rem; font-weight: 800; color: #FF8A50; }
    p { font-size: 1rem; color: #AAAAAA; max-width: 340px; line-height: 1.6; }
    button {
      min-height: 48px;
      background: #C84B00;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 0 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { background: #A83F00; }
  </style>
</head>
<body>
  <img src="/logo.png" alt="Karibu Baskin" />
  <h1 id="title">Sei senza connessione</h1>
  <p id="desc">Questa pagina non è tra quelle già aperte. Riprova quando torna la rete.</p>
  <button id="btn" type="button" onclick="location.reload()">Riprova</button>
  <script>
    var lang = (document.cookie.match(/(?:^|;\s*)karibu-locale=([^;]+)/) || [])[1];
    if (lang === "en") {
      document.documentElement.lang = "en";
      document.title = "Karibu Baskin · Offline";
      document.getElementById("title").textContent = "You are offline";
      document.getElementById("desc").textContent =
        "This page is not among the ones you already opened. Try again when you are back online.";
      document.getElementById("btn").textContent = "Try again";
    }
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
